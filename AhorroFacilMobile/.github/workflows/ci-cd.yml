name: CI/CD - AhorroFácil Pro

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================
  # JOB 1: PRUEBAS AUTOMATIZADAS (CI)
  # ============================================
  test:
    name: 🔍 Pruebas Automatizadas
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v3
      
      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Instalar dependencias
        run: npm ci
      
      - name: 🧪 Ejecutar pruebas unitarias
        run: npm test -- --watchAll=false --coverage
      
      - name: 📊 Subir reporte de cobertura
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

  # ============================================
  # JOB 2: GENERAR APK DEBUG (CD)
  # ============================================
  build-android-debug:
    name: 📱 Generar APK Debug
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v3
      
      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Instalar dependencias
        run: npm ci
      
      - name: 🔧 Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 📱 Generar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: 📤 Subir APK Debug como artefacto
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ============================================
  # JOB 3: GENERAR APK RELEASE (CD)
  # ============================================
  build-android-release:
    name: 🔐 Generar APK Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v3
      
      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Instalar dependencias
        run: npm ci
      
      - name: 🔧 Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 🔐 Configurar keystore para firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/keystore.jks
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "KEY_ALIAS=$KEY_ALIAS" >> android/key.properties
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> android/key.properties
      
      - name: 📱 Generar APK Release firmado
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      
      - name: 📤 Subir APK Release como artefacto
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

  # ============================================
  # JOB 4: NOTIFICACION FINAL
  # ============================================
  notify:
    name: 📢 Resultado del Pipeline
    runs-on: ubuntu-latest
    needs: [test, build-android-debug]
    if: always()
    
    steps:
      - name: ✅ Éxito
        if: needs.test.result == 'success' && needs.build-android-debug.result == 'success'
        run: echo "🎉 Pipeline exitoso! APK generado correctamente."
      
      - name: ❌ Error
        if: needs.test.result == 'failure' || needs.build-android-debug.result == 'failure'
        run: echo "⚠️ Hubo errores en el pipeline. Revisa los logs."